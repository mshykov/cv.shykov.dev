<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern browsers: SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Legacy fallback -->
    <link rel="alternate icon" href="/favicon.ico" />
    <!-- iOS Safari: tab thumbnails + Add to Home Screen -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-title" content="ATS Resume Toolkit" />
    <!-- Mobile address-bar tint -->
    <meta name="theme-color" content="#4f46e5" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Everything between the seo markers is REPLACED at build time, once per
      language, by scripts/prerender.mjs (title, description, canonical, hreflang,
      Open Graph, Twitter, JSON-LD — all from src/i18n/messages/<locale>.ts).
      What is written here is only what the dev server shows; edit the words in
      src/i18n/messages/en.ts, not here.
    -->
    <!--seo:start-->
    <title>Free CV ATS Score Checker | ATS Resume Checker, No Upload</title>
    <meta name="description" content="Free CV score checker: get your CV or resume ATS score in seconds from a PDF or DOCX. Runs 100% in your browser. No upload, no signup, no AI." />
    <link rel="canonical" href="https://cv.shykov.dev/" />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
