name: CI

# PRs only: main requires this check with strict status checks, so a merged
# commit is the tree the PR run already passed — re-running it on the push to
# main only spent Actions minutes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for the same PR: pushing three times to a branch
# should not run three full pipelines. Runs on `main` are never cancelled — that
# is the commit that gates the deploy, so it must always complete.
#
# NOTE: deliberately no `paths-ignore` here. `build` is a required status check,
# and a skipped workflow never reports one — so a docs-only PR would be blocked
# from merging forever rather than merged quickly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA-pinned (tags can be moved/hijacked); bumped in the monthly dependency sweep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only workflow — don't leave the token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: a compromised transitive dep must not get arbitrary
      # code execution on the runner just by being installed. Verified the
      # build and both test suites pass without any postinstall hook.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke:build

      # WebKit e2e under the production CSP — the project's worst historical
      # bugs were Safari-only and invisible to everything above this line.
      #
      # The browser binary is ~80 MB and dominated CI time once this step landed
      # (build went from ~22s to ~1m20s). Cache it, keyed on the Playwright
      # version so a Dependabot bump invalidates the cache automatically.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Both install steps below run apt-get update, which refreshes EVERY
      # source on the runner — including Google's Chrome repo. That repo has
      # served a Packages.gz whose hash did not match its Release file ("Hash
      # Sum mismatch"); apt exits 100 and, `build` being a required check,
      # a broken third-party index we do not use would block every merge.
      # (It took down engineering-changelog's e2e job.) We test Playwright's
      # own WebKit; the google-chrome package is nothing to do with us.
      #
      # Unlike Chromium, WebKit really needs apt: ~180 packages (GTK 4,
      # GStreamer) are absent from the runner image, so there is no skipping
      # the install itself.
      - name: Drop the google-chrome apt source
        # Matched on the URL, not the filename: the runner image may declare
        # the repo as .list or as deb822 .sources. Prints what it found so a
        # future failure here is diagnosable from the log.
        run: |
          echo "--- before ---"; ls -1 /etc/apt/sources.list.d/ || true
          grep -rl "dl\.google\.com" /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          echo "--- after ---"; ls -1 /etc/apt/sources.list.d/ || true
          ! grep -rq "dl\.google\.com" /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null \
            && echo "google-chrome source gone" || echo "WARNING: still referenced"
      - name: Install WebKit (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # The repo's own pinned binary, not npx — npx will fetch and execute a
        # package on demand if the name misses locally.
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Install WebKit system deps only (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps webkit

      - run: npm run test:e2e
