name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (tags can be moved/hijacked); Dependabot bumps the SHAs weekly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Read-only workflow — don't leave the token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke:build
      # WebKit e2e under the production CSP — the project's worst historical
      # bugs were Safari-only and invisible to everything above this line.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
